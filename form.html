<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --secondary-color: #f5f7fa;
            --text-color: #333;
            --border-color: #ccc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef2f3;
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .form-container {
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: var(--primary-color);
        }

        fieldset {
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 20px;
            margin-bottom: 20px;
        }

        legend {
            font-weight: bold;
            padding: 0 10px;
            color: var(--primary-color);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group.inline {
            display: flex;
            gap: 15px;
        }

        .form-group.inline > div {
            flex: 1;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 0.9em;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 1srem;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 5px rgba(74, 144, 226, 0.3);
        }

        .radio-checkbox-group {
            display: flex;
            gap: 15px;
            margin-top: 5px;
        }

        .radio-checkbox-group label {
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: normal;
            cursor: pointer;
        }

        textarea {
            resize: vertical;
            height: 80px;
        }

        .btn-container {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s ease-in-out;
        }

        button[type="submit"] {
            background-color: var(--primary-color);
            color: white;
        }

        button[type="submit"]:hover {
            background-color: #357abd;
        }

        button[type="reset"] {
            background-color: #e0e0e0;
            color: #333;
        }

        button[type="reset"]:hover {
            background-color: #d5d5d5;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Student Registration Form</h2>
   
    <!-- Change the action attribute to your backend processing URL -->
    <form action="/submit_registration" method="POST" enctype="multipart/form-data">
       
        <!-- Section 1: Personal Details -->
        <fieldset>
            <legend>Personal Details</legend>
           
            <div class="form-group inline">
                <div>
                    <label for="firstName">First Name *</label>
                    <input type="text" id="firstName" name="first_name" placeholder="John" required>
                </div>
                <div>
                    <label for="lastName">Last Name *</label>
                    <input type="text" id="lastName" name="last_name" placeholder="Doe" required>
                </div>
            </div>

            <div class="form-group inline">
                <div>
                    <label for="dob">Date of Birth *</label>
                    <input type="date" id="dob" name="dob" required>
                </div>
                <div>
                    <label>Gender *</label>
                    <div class="radio-checkbox-group">
                        <label><input type="radio" name="gender" value="male" required> Male</label>
                        <label><input type="radio" name="gender" value="female"> Female</label>
                        <label><input type="radio" name="gender" value="other"> Other</label>
                    </div>
                </div>
            </div>
        </fieldset>

        <!-- Section 2: Contact Information -->
        <fieldset>
            <legend>Contact Information</legend>
           
            <div class="form-group inline">
                <div>
                    <label for="email">Email Address *</label>
                    <input type="email" id="email" name="email" placeholder="john.doe@example.com" required>
                </div>
                <div>
                    <label for="phone">Phone Number *</label>
                    <!-- Validates for a basic 10-digit number structure -->
                    <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" placeholder="1234567890" title="Please enter a valid 10-digit phone number" required>
                </div>
            </div>

            <div class="form-group">
                <label for="address">Permanent Address *</label>
                <textarea id="address" name="address" placeholder="Street, Apartment, City, State, ZIP" required></textarea>
            </div>
        </fieldset>

        <!-- Section 3: Academic Information -->
        <fieldset>
            <legend>Academic Selection</legend>
           
            <div class="form-group">
                <label for="course">Course Applied For *</label>
                <select id="course" name="course" required>
                    <option value="" disabled selected>-- Select a Course --</option>
                    <option value="cs">Computer Science & Engineering</option>
                    <option value="it">Information Technology</option>
                    <option value="ece">Electronics & Communication</option>
                    <option value="me">Mechanical Engineering</option>
                    <option value="ce">Civil Engineering</option>
                </select>
            </div>

            <div class="form-group">
                <label>Extracurricular Interests</label>
                <div class="radio-checkbox-group">
                    <label><input type="checkbox" name="interests" value="sports"> Sports</label>
                    <label><input type="checkbox" name="interests" value="music"> Music</label>
                    <label><input type="checkbox" name="interests" value="arts"> Arts & Drama</label>
                    <label><input type="checkbox" name="interests" value="coding"> Coding Club</label>
                </div>
            </div>

            <div class="form-group">
                <label for="photo">Upload Student Photo (Max 2MB)</label>
                <input type="file" id="photo" name="student_photo" accept="image/*">
            </div>
        </fieldset>

        <!-- Form Actions -->
        <div class="btn-container">
            <button type="reset">Reset Form</button>
            <button type="submit">Submit Registration</button>
        </div>

    </form>
</div>

</body>
</html>
